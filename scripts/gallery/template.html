<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Nothing loads from other sites: the page is its own inline style and script. -->
    <!--SITE_CSP-->
    <!--SITE_HEAD-->
    <style>
      /* SITE_CSS */
      .wrap {
        max-width: 1240px;
        width: 100%;
        margin: 0 auto;
        padding-inline: 16px;
        padding-block: 28px 64px;
        display: grid;
        gap: 28px;
      }

      /* Hero section */
      .hero {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: 28px 24px;
        box-shadow: var(--shadow-sm);
        display: grid;
        gap: 20px;
        min-width: 0;
      }
      .hero-top {
        display: grid;
        gap: 10px;
      }
      .hero h1 {
        font-size: clamp(1.45rem, 2.8vw, 2.1rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0;
        text-wrap: balance;
      }
      .hero h1 code {
        font-family: var(--font-mono);
        font-size: 0.9em;
        padding: 2px 7px;
        border-radius: var(--radius-sm);
        background: var(--accent-soft);
        color: var(--accent);
      }
      .hero-sub {
        margin: 0;
        color: var(--muted);
        max-width: 72ch;
        font-size: 0.98rem;
      }
      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }
      .install-pill,
      .cli-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: var(--bg);
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-sm);
        padding: 5px 6px 5px 12px;
        font-family: var(--font-mono);
        font-size: 0.85rem;
        max-width: 100%;
        min-width: 0;
      }
      .install-pill code,
      .cli-pill code {
        overflow-x: auto;
        white-space: nowrap;
        color: var(--fg);
      }
      .btn-copy {
        appearance: none;
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: 4px;
        color: var(--fg);
        font-family: var(--font-ui);
        font-size: 0.78rem;
        font-weight: 600;
        padding: 4px 10px;
        cursor: pointer;
        flex-shrink: 0;
        transition:
          background-color 120ms ease,
          border-color 120ms ease,
          color 120ms ease;
      }
      .btn-copy:hover {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .btn-copy.copied {
        background: var(--success-soft);
        border-color: var(--success);
        color: var(--success);
      }
      .hero-facts {
        list-style: none;
        margin: 0;
        padding: 12px 0 0;
        border-top: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 8px 24px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .hero-facts li::before {
        content: "•";
        color: var(--accent);
        font-weight: 700;
        margin-right: 6px;
      }
      .hero-facts strong {
        color: var(--fg);
        font-weight: 600;
      }

      /* Sticky filter bar */
      .controls {
        position: sticky;
        top: 53px;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
        padding: 12px 16px;
        background: var(--surface-glass);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
      }
      .control {
        display: grid;
        gap: 4px;
        border: 0;
        margin: 0;
        padding: 0;
        min-width: 0;
      }
      .control legend {
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        padding: 0;
        margin-bottom: 4px;
      }

      /* Responsive theme cards grid */
      .list {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 24px;
      }
      @media (min-width: 1100px) {
        .list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .theme {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: 20px;
        box-shadow: var(--shadow-sm);
        display: grid;
        gap: 14px;
        min-width: 0;
        scroll-margin-top: 136px;
      }
      .theme[hidden] {
        display: none;
      }
      .theme-head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 20px;
        align-items: end;
      }
      .theme-name {
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .theme-name h3 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
      }
      .theme-anchor {
        color: inherit;
        text-decoration: none;
      }
      .theme-anchor:hover {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .theme-id {
        font-family: var(--font-mono);
        font-size: 0.8rem;
        color: var(--muted);
      }
      .theme-desc {
        margin: 0;
        color: var(--muted);
        grid-column: 1;
        font-size: 0.9rem;
      }
      .metrics {
        grid-column: 2;
        grid-row: 1 / span 2;
        display: flex;
        gap: 16px;
        margin: 0;
      }
      .metrics div {
        display: grid;
        gap: 1px;
      }
      .metrics dt {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .metrics dd {
        margin: 0;
        font-family: var(--font-mono);
        font-size: 0.88rem;
        font-variant-numeric: tabular-nums;
      }
      .metrics .states dd {
        display: flex;
        gap: 5px;
        padding-top: 3px;
      }
      .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid var(--border-strong);
      }

      .theme-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding-top: 4px;
      }
      .btn-use-theme {
        color: var(--accent);
        font-size: 0.86rem;
        font-weight: 600;
        text-decoration: none;
        padding: 5px 10px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        background: var(--accent-soft);
        transition:
          border-color 120ms ease,
          opacity 120ms ease;
      }
      .btn-use-theme:hover {
        border-color: var(--accent);
      }

      .cvd-protan .term {
        filter: url(#protan);
      }
      .cvd-deutan .term {
        filter: url(#deutan);
      }
      .cvd-tritan .term {
        filter: url(#tritan);
      }

      .note {
        color: var(--muted);
        font-size: 0.85rem;
        margin: 0;
        max-width: 75ch;
      }

      .hero-term {
        margin: 0;
      }
      .section-title {
        margin: 8px 0 -8px;
        font-size: 1.35rem;
        letter-spacing: -0.01em;
        scroll-margin-top: 76px;
      }
      .intro {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: 22px 24px;
        box-shadow: var(--shadow-sm);
        min-width: 0;
        scroll-margin-top: 76px;
      }
      .panel h2 {
        margin: 0 0 10px;
        font-size: 1.2rem;
      }
      .panel p {
        margin: 0 0 10px;
        color: var(--muted);
      }
      .panel p:last-child {
        margin-bottom: 0;
      }
      .panel a {
        color: var(--accent);
      }
      .steps {
        margin: 0;
        padding-left: 22px;
        display: grid;
        gap: 10px;
      }
      .steps code,
      .panel p code {
        font-family: var(--font-mono);
        font-size: 0.88em;
        background: var(--accent-soft);
        border-radius: 4px;
        padding: 1px 5px;
      }
      /* The terminal shot on the left, the three bar strips stacked beside it. */
      .shots {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        align-items: start;
        gap: 18px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .shots figure {
        margin: 0;
        display: grid;
        gap: 8px;
      }
      .shots img {
        width: 100%;
        height: auto;
        border-radius: var(--radius-md);
        border: 1px solid var(--line);
        background: var(--term-dark-bg);
      }
      .shots li:first-child {
        grid-row: span 3;
      }
      @media (max-width: 760px) {
        .shots {
          grid-template-columns: minmax(0, 1fr);
        }
        .shots li:first-child {
          grid-row: auto;
        }
      }
      .shots figcaption {
        font-size: 0.86rem;
        color: var(--muted);
      }
      .trust {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .trust a {
        display: inline-block;
        padding: 4px 10px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-pill);
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--fg);
        text-decoration: none;
      }
      .trust a:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      @media (max-width: 640px) {
        .hero {
          padding: 20px 16px;
        }
        .theme {
          padding: 16px;
        }
        .theme-head {
          grid-template-columns: 1fr;
        }
        .metrics {
          grid-column: 1;
          grid-row: auto;
          margin-top: 6px;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <!-- Machado et al. (2009) full-severity simulation, applied in linear RGB. -->
      <filter id="protan" color-interpolation-filters="linearRGB">
        <feColorMatrix
          type="matrix"
          values="0.152286 1.052583 -0.204868 0 0  0.114503 0.786281 0.099216 0 0  -0.003882 -0.048116 1.051998 0 0  0 0 0 1 0"
        />
      </filter>
      <filter id="deutan" color-interpolation-filters="linearRGB">
        <feColorMatrix
          type="matrix"
          values="0.367322 0.860646 -0.227968 0 0  0.280085 0.672501 0.047413 0 0  -0.01182 0.04294 0.968881 0 0  0 0 0 1 0"
        />
      </filter>
      <filter id="tritan" color-interpolation-filters="linearRGB">
        <feColorMatrix
          type="matrix"
          values="1.255528 -0.076749 -0.178779 0 0  -0.078411 0.930809 0.147602 0 0  0.004733 0.691367 0.3039 0 0  0 0 0 1 0"
        />
      </filter>
    </svg>

    <!--SITE_HEADER-->

    <main
      class="wrap"
      id="main"
      data-copy="{{copy}}"
      data-copied="{{copied}}"
      data-copied-status="{{copiedStatus}}"
      data-termdark="{{termDark}}"
      data-termlight="{{termLight}}"
    >
      <section class="hero" aria-label="{{introLabel}}">
        <div class="hero-top">
          <h1>{{heroTitle}}</h1>
          <p class="hero-sub">{{heroSub}}</p>
        </div>

        <figure class="term-frame hero-term" data-bg="dark">
          <figcaption class="sr-only">{{heroBarCaption}}</figcaption>
          <div class="term-titlebar">
            <div class="term-dots" aria-hidden="true">
              <span class="term-dot"></span>
              <span class="term-dot"></span>
              <span class="term-dot"></span>
            </div>
            <span class="term-title">dark-aurora · default preset</span>
          </div>
          <div class="term" data-bg="dark">
            <div class="screen"><!--HERO_BAR--></div>
          </div>
        </figure>

        <div class="hero-actions">
          <div class="install-pill">
            <code>npx agy-powerline init</code>
            <button
              type="button"
              class="btn-copy"
              data-copy="npx agy-powerline init"
              aria-label="{{copyInstall}}"
            >
              <span class="copy-label">{{copy}}</span>
            </button>
          </div>
          <a class="btn btn-primary" href="/configure/">{{buildInBrowser}}</a>
          <a class="btn btn-secondary" href="https://github.com/wassim-azi/agy-powerline"
            >{{viewOnGithub}}</a
          >
        </div>

        <ul class="hero-facts" aria-label="{{keyFacts}}">
          {{facts}}
        </ul>
      </section>

      <!--INTRO-->

      <span class="sr-only" id="copyStatus" aria-live="polite"></span>

      <h2 class="section-title" id="themes">{{themesTitle}}</h2>

      <div class="controls" role="group" aria-label="{{displayOptions}}">
        <fieldset class="control">
          <legend>{{themesLegend}}</legend>
          <div class="seg">
            <input type="radio" name="kind" id="kind-all" value="all" checked /><label
              for="kind-all"
              >{{all}}</label
            >
            <input type="radio" name="kind" id="kind-dark" value="dark" /><label for="kind-dark"
              >{{dark}}</label
            >
            <input type="radio" name="kind" id="kind-light" value="light" /><label for="kind-light"
              >{{light}}</label
            >
            <input type="radio" name="kind" id="kind-cb" value="colorblind" /><label for="kind-cb"
              >{{colorblind}}</label
            >
          </div>
        </fieldset>
        <fieldset class="control">
          <legend>{{bgLegend}}</legend>
          <div class="seg">
            <input type="radio" name="bg" id="bg-match" value="match" checked /><label
              for="bg-match"
              >{{intended}}</label
            >
            <input type="radio" name="bg" id="bg-dark" value="dark" /><label for="bg-dark"
              >{{dark}}</label
            >
            <input type="radio" name="bg" id="bg-light" value="light" /><label for="bg-light"
              >{{light}}</label
            >
          </div>
        </fieldset>
        <fieldset class="control">
          <legend>{{colorVision}}</legend>
          <div class="seg">
            <input type="radio" name="cvd" id="cvd-none" value="none" checked /><label
              for="cvd-none"
              >{{typical}}</label
            >
            <input type="radio" name="cvd" id="cvd-protan" value="protan" /><label for="cvd-protan"
              >Protanopia</label
            >
            <input type="radio" name="cvd" id="cvd-deutan" value="deutan" /><label for="cvd-deutan"
              >Deuteranopia</label
            >
            <input type="radio" name="cvd" id="cvd-tritan" value="tritan" /><label for="cvd-tritan"
              >Tritanopia</label
            >
          </div>
        </fieldset>
      </div>

      <div class="list">
        <!--CARDS-->
      </div>

      <p class="note">{{note}}</p>
    </main>

    <!--SITE_FOOTER-->

    <script>
      /* SITE_THEME_SCRIPT */
    </script>
    <script>
      (function () {
        const page = document.getElementById("main");
        const cards = Array.from(document.querySelectorAll(".theme"));
        const copyStatus = document.getElementById("copyStatus");

        function apply() {
          const kind = document.querySelector('input[name="kind"]:checked').value;
          const bg = document.querySelector('input[name="bg"]:checked').value;
          const cvd = document.querySelector('input[name="cvd"]:checked').value;
          for (const card of cards) {
            card.hidden = kind !== "all" && card.dataset.kind !== kind;
            const nextBg = bg === "match" ? card.dataset.target : bg;
            const term = card.querySelector(".term");
            const frame = card.querySelector(".term-frame");
            const bgLabel = card.querySelector(".term-bg-label");
            term.dataset.bg = nextBg;
            if (frame) frame.dataset.bg = nextBg;
            if (bgLabel) bgLabel.textContent = page.dataset["term" + nextBg];
          }
          page.classList.remove("cvd-protan", "cvd-deutan", "cvd-tritan");
          if (cvd !== "none") page.classList.add("cvd-" + cvd);
        }

        function selectElementText(el) {
          if (!el || !window.getSelection || !document.createRange) return;
          const range = document.createRange();
          range.selectNodeContents(el);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        }

        function markCopied(btn, text) {
          const label = btn.querySelector(".copy-label") || btn;
          label.textContent = page.dataset.copied;
          btn.classList.add("copied");
          if (copyStatus) {
            copyStatus.textContent = page.dataset.copiedStatus.replace("%s", text);
          }
          clearTimeout(btn._copyTimer);
          btn._copyTimer = setTimeout(() => {
            label.textContent = page.dataset.copy;
            btn.classList.remove("copied");
          }, 1800);
        }

        document.addEventListener("click", (e) => {
          const btn = e.target.closest(".btn-copy");
          if (!btn) return;
          const text = btn.getAttribute("data-copy");
          if (!text) return;
          const codeEl = btn.parentElement && btn.parentElement.querySelector("code");
          if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
            navigator.clipboard.writeText(text).then(
              () => markCopied(btn, text),
              () => {
                selectElementText(codeEl);
                markCopied(btn, text);
              }
            );
          } else {
            selectElementText(codeEl);
            markCopied(btn, text);
          }
        });

        document
          .querySelectorAll(".controls input")
          .forEach((input) => input.addEventListener("change", apply));
        apply();
      })();
    </script>
  </body>
</html>
