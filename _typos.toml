# typos (https://github.com/crate-ci/typos) checks English only, so it skips
# the translated READMEs and French site text, where every French word looks like a typo.
[files]
extend-exclude = ["README.*.md", "scripts/site/home-text.js"]

[default.extend-identifiers]
# The Nerd Font code point of a Powerline cap, which typos would read as "BA".
E0BA = "E0BA"
e0ba = "e0ba"

[default.extend-words]
# A correct spelling, used in code, docs and tests.
unparseable = "unparseable"
# A test cuts "middleware" short on purpose.
middlewar = "middlewar"
# A French label in scripts/site/layout.js
Projet = "Projet"
